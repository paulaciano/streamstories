name: CI

on:
  push:
    branches: [main]
  # Every pull request, including those stacked on another feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Maven Central sometimes fails for a moment ("could not find artifact"). Downloading the dependencies first,
      # with a few retries, keeps such a glitch from failing the build. -U skips Maven's cache of failed lookups.
      - name: Download dependencies
        run: |
          for attempt in 1 2 3; do
            ./mvnw --batch-mode --no-transfer-progress --update-snapshots dependency:go-offline && exit 0
            echo "Attempt $attempt to download the dependencies failed; retrying in 20 seconds."
            sleep 20
          done
          exit 1

      # Runs formatting checks, unit/slice tests, Testcontainers integration tests and module verification.
      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
