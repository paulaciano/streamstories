# Local development database. Spring Boot starts it automatically on `./mvnw spring-boot:run`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: streamstories
      POSTGRES_USER: streamstories
      POSTGRES_PASSWORD: streamstories
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
