spring:
  application:
    name: streamstories
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lazy collections (such as the genres of each title in a page) load in batches instead of one query per row.
      hibernate.default_batch_fetch_size: 50
  web:
    # Validation messages are always in Spanish, like the rest of the problem details.
    locale: es
    locale-resolver: fixed
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      # 4.5 in an integer field is a client error, not 4.
      accept-float-as-int: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: StreamStories
    version: "@project.version@"

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

streamstories:
  security:
    # The JWT secret has no default: set STREAMSTORIES_SECURITY_JWT_SECRET (at least 32 characters).
    jwt:
      issuer: streamstories
      access-token-ttl: 15m
    refresh-token-ttl: 7d
