spring:
  application:
    name: streamstories
  profiles:
    # Local runs use the dev profile unless SPRING_PROFILES_ACTIVE says otherwise.
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: StreamStories
    version: "@project.version@"

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

streamstories:
  security:
    # The JWT secret has no default: set STREAMSTORIES_SECURITY_JWT_SECRET (at least 32 characters).
    jwt:
      issuer: streamstories
      access-token-ttl: 15m
    refresh-token-ttl: 7d
