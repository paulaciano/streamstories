spring:
  application:
    name: streamstories
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: StreamStories
    version: "@project.version@"

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
